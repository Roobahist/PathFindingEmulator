[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pathfinding-emulator"
version = "0.2.0"
description = "A Pygame box-pushing puzzle editor and bounded search simulator"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["pygame==2.6.1"]

[project.optional-dependencies]
dev = ["ruff==0.17.0", "build==1.6.1", "pip-audit==2.10.1"]

[project.scripts]
pathfinding-emulator = "pathfinding_emulator.app:main"

[tool.setuptools]
py-modules = ["Main", "Env", "MapLoader", "Utils", "ai", "Astarr", "simpids", "MainGui", "MapEditor", "GuiSolver", "other_agents"]

[tool.setuptools.packages.find]
include = ["pathfinding_emulator*"]

[tool.setuptools.package-data]
pathfinding_emulator = ["assets/*.png", "assets/env/*/*.jpg", "assets/agent/*/*.png", "sample_maps/*.pickle"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
